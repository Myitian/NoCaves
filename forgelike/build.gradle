plugins {
    id "com.gradleup.shadow" version "9.2.2"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
        mixinConfig "${project.mod_id}-common.mixins.json"
        mixinConfig "${project.mod_id}-variant.mixins.json"
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

shadow {
    addShadowVariantIntoJavaComponent = false
}

dependencies {
    forge "net.minecraftforge:forge:${project.main_forge_version}"
    modImplementation "me.shedaniel.cloth:cloth-config-forge:${project.main_cloth_config_version}"
    modImplementation "net.neoforged:neoforge:${project.main_neoforge_version}:universal"

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }
    common(project(":variant-forgelike-wrapper")) { transitive = false }
    shadowCommon(project(":variant-forgelike-wrapper")) { transitive = false }
}

shadowJar {
    exclude("fabric.mod.json", "architectury.common.json", "*-refmap.json", "architectury_inject*/**")
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
    def variantSources = project(":variant-forgelike-wrapper").sourcesJar
    dependsOn variantSources
    from variantSources.archiveFile.map { zipTree(it) }
}